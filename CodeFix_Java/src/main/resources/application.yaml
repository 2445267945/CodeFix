server:
  port: 8080

spring:
  data:
    redis:
      port: xxx
      host: xxx
      password: xxxx
      database: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://xxxx:xxxx/code_fix?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    username: xxx
    password: xxx


mq:
  rocketmq:
    name-server: xxxx
    consumer:
      groupName: cid_status_group_test
      topics: agent_status_topic
    heartbeat-consumer:
      groupName: cid_heartbeat_group
      topics: agent_heartbeat_topic
    producer:
      groupName: cid_task_group
      topics: agent_task_topic
    topic:
      status: agent_status_topic
      statusQueueNum: 8
      heartbeat: agent_heartbeat_topic
      heartbeatQueueNum: 8

agent:
  embedding:
    provider: ollama
    model: nomic-embed-text:latest
    dimension: 768
    base-url: http://xxxx:xxxx
  memory:
    vector:
      distance-metric: COSINE
      index-name: 'agent_task_memory_idx'
      key-prefix: 'agent:task-memory:'

py:
  url: http://xxxxx:xxxx/analyze